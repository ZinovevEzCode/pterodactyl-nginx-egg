name: Validate pending ANDLINE runtime

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-runtime-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout pending runtime branch
        uses: actions/checkout@v7
        with:
          ref: andline-runtime

      - name: Validate Pterodactyl egg
        run: python3 scripts/validate-egg.py egg-andline.json

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build latest runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            PHP_VERSION=8.5
            NODE_MAJOR=24
            NEWT_VERSION=1.18.1
          tags: andline-runtime:integration
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test runtime
        run: |
          docker run --rm --entrypoint /bin/bash andline-runtime:integration -lc '
            set -e
            php -v
            php -m | grep -q pdo_mysql
            php -m | grep -q pdo_pgsql
            php -m | grep -q sockets
            node --version
            npm --version
            composer --version
            /usr/sbin/nginx -v
            supervisord --version
            newt --version || newt --help >/dev/null
            bash -n /entrypoint.sh
            bash -n /usr/local/bin/andline-deploy
            bash -n /usr/local/bin/andline-start
            bash -n /usr/local/bin/andline-websocket
            bash -n /usr/local/bin/andline-queue
            bash -n /usr/local/bin/andline-scheduler
            bash -n /usr/local/bin/andline-newt
          '
