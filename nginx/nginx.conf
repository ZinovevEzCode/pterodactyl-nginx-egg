worker_processes auto;
pid /home/container/tmp/nginx.pid;
error_log /home/container/logs/nginx/error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /home/container/logs/nginx/access.log main;

    map $http_x_forwarded_proto $andline_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    map $andline_forwarded_proto $andline_fastcgi_https {
        default off;
        https   on;
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 128m;

    client_body_temp_path /home/container/tmp/nginx/client_temp;
    proxy_temp_path /home/container/tmp/nginx/proxy_temp;
    fastcgi_temp_path /home/container/tmp/nginx/fastcgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    include /home/container/runtime/nginx/*.conf;
}
